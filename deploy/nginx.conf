map $http_x_forwarded_proto $bluesteam_forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow up to 200 MB video uploads + multipart/form-data envelope overhead (Finding 11)
    client_max_body_size 210m;

    location /api/ {
        proxy_pass http://bluesteam_backend:8010/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $bluesteam_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }


    # Preserve existing content URLs after the asset was renamed.
    location = /assets/generated/game_habitat_ocean_zones_board.png {
        rewrite ^ /assets/generated/interactive/habitat-scene.png last;
    }

    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # Revalidate the SPA entry after a deploy; only fingerprinted assets stay cached.
    location = /index.html {
        add_header Cache-Control "no-cache, max-age=0, must-revalidate" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
